# ============================================================
# 钢铁表面缺陷检测系统 - 配置文件
# ============================================================

# --- 系统 ---
system:
  name: "steel-defect-detection"
  version: "1.0.0"
  log_level: "INFO"
  log_dir: "./logs"

# --- 图像采集 ---
camera:
  source: "0"  # 摄像头源: "0"=本地摄像头, "rtsp://..."=RTSP 流地址
  width: 1920
  height: 1080
  fps: 30
  buffer_size: 10  # 帧缓存队列大小
  trigger_mode: "continuous"  # continuous | plc_signal

# --- YOLO 检测引擎 ---
yolo:
  model_path: "models/weights/steel_defect.onnx"  # 模型权重路径; 多模型用逗号分隔; 支持 yolo26n.pt / models/weights/*.pt
  conf_threshold: 0.01  # 置信度阈值 (极低阈值确保检出所有潜在缺陷)
  iou_threshold: 0.45   # NMS IOU 阈值
  img_size: 640         # 输入分辨率
  device: "auto"        # auto | cuda:0 | cpu
  half: false           # FP16 推理 (仅 GPU 建议开启，需 CUDA)
  augment: true         # 测试时增强 (TTA提升检出率)

# --- VLM 检测引擎 ---
vlm:
  enabled: true
  api_base: ""               # 留空自动检测 (Qwen > Gemini)
  model: ""                  # 留空自动选择默认模型 (qwen-vl-max / gemini-2.5-flash)
  max_tokens: 2048
  temperature: 0.1
  timeout: 8                 # API 超时秒数 (国内建议5-10s)
  max_retries: 0             # 重试次数 (国内 Gemini 被墙，建议0)
  conf_threshold: 0.5        # VLM 介入的 YOLO 置信度阈值

# --- 数据库 ---
database:
  path: "data/inspection.db"
  backup_interval_hours: 24

# --- 导出 ---
export:
  csv_dir: "data/exports/csv"
  html_dir: "data/exports/reports"
  badcase_dir: "data/exports/badcase"
  image_format: "jpg"

# --- Server ---
server:
  host: "0.0.0.0"
  port: 7860
  share: true               # 是否生成外网链接 (对于 FastAPI 无直接影响，但作为保留配置)

# --- 双引擎协同 ---
pipeline:
  vlm_fallback: true         # VLM 不可用时 YOLO 兜底
  save_all_images: false     # 是否保存所有图像
  save_defect_only: true     # 仅保存有缺陷的图像
  review_required: true      # 是否要求人工审核
